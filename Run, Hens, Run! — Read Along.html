*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Andika',Georgia,serif;background:#f7f5f1;color:#41352a;
     -webkit-text-size-adjust:100%}
.wrap{max-width:900px;margin:0 auto;padding:22px 18px 60px}

header{border-bottom:3px solid #3f8672;padding-bottom:12px;margin-bottom:6px}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;
         color:#3f8672;font-weight:700}
h1{font-size:38px;line-height:1.1;margin:6px 0 2px}
.credit{font-size:14px;color:#8b7a63;font-style:italic}

.bar{position:sticky;top:0;z-index:5;background:#f7f5f1;padding:12px 0 10px;
     border-bottom:1px solid #ded6c8;display:flex;flex-wrap:wrap;gap:10px;
     align-items:center}
button{font-family:inherit;font-size:16px;cursor:pointer;border-radius:9px;
       border:2px solid #cfc6b4;background:#fff;color:#41352a;padding:9px 16px}
button:hover{border-color:#3f8672}
button:focus-visible{outline:3px solid #3f8672;outline-offset:2px}
#playall{background:#3f8672;border-color:#3f8672;color:#fff;font-weight:700;
         min-width:150px}
#playall.on{background:#c24f26;border-color:#c24f26}
.speed{display:flex;gap:6px;align-items:center;margin-left:auto}
.speed .lab{font-size:12px;letter-spacing:.14em;text-transform:uppercase;
            color:#8b7a63;font-weight:700}
.speed button{padding:7px 13px;font-size:15px}
.speed button.on{background:#3f8672;border-color:#3f8672;color:#fff;font-weight:700}

.watch{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0 4px}
.watch .lab{font-size:12px;letter-spacing:.14em;text-transform:uppercase;
            color:#3f8672;font-weight:700}
.watch .w{background:#fde9c9;border-radius:7px;padding:5px 15px;font-size:20px;
          font-weight:700}

.fallback{border-left:4px solid #c24f26;background:#fdf1ec;padding:10px 14px;
          margin:14px 0 0;font-size:14px;line-height:1.5;color:#7a4a34}
.fallback b{color:#8f3714}

.blk{margin:22px 0 0}
.blk .n{display:inline-block;width:26px;height:26px;border-radius:50%;
        background:#3f8672;color:#fff;font-size:13px;font-weight:700;
        text-align:center;line-height:26px;margin-bottom:6px}
.ln{display:flex;gap:12px;align-items:center;width:100%;text-align:left;
    background:#fff;border:2px solid #e4ddcf;border-radius:11px;
    padding:11px 14px;margin-bottom:8px;font-size:25px;line-height:1.45;
    color:#41352a;transition:border-color .12s,background .12s}
.ln:hover{border-color:#3f8672}
.ln .ico{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid #3f8672;
         color:#3f8672;font-size:13px;line-height:26px;text-align:center}
.ln .tx{flex:1}
.ln mark{background:#fde9c9;color:#41352a;border-radius:4px;padding:0 3px}
.ln.on{border-color:#c24f26;background:#fff8f4}
.ln.on .ico{background:#c24f26;border-color:#c24f26;color:#fff}
.ln.done .ico{background:#3f8672;color:#fff}

footer{margin-top:34px;border-top:1px solid #ded6c8;padding-top:10px;
       font-size:13px;color:#8b7a63;font-style:italic}

@media (max-width:640px){
  .wrap{padding:16px 12px 50px}
  h1{font-size:30px}
  .ln{font-size:21px;padding:10px 12px}
  .speed{margin-left:0;width:100%}
}

<div class="blk"><span class="n">1</span><button class="ln done" data-i="0" onclick="tap(0)"><span class="ico">▶</span><span class="tx">“Six fat hens in a pen,” said Fox.</span></button><button class="ln done" data-i="1" onclick="tap(1)"><span class="ico">▶</span><span class="tx">“Yum!  Yum!</span></button><button class="ln done" data-i="2" onclick="tap(2)"><span class="ico">▶</span><span class="tx">I will get a big fat hen.”</span></button></div>

var LINES=[{say:"“Six fat hens in a pen,” said Fox."},{say:"“Yum! Yum!"},{say:"I will get a big fat hen.”"},{say:"Fox hops in the pen."},{say:"Look out, hens!"},{say:"Run, hens! Run!"},{say:"Zip, zip, zip!"},{say:"Not every hen ran."},{say:"Every hen ran but Red Hen."},{say:"Fox runs at Red Hen."},{say:"“Yum, yum!” yips Fox."},{say:"“I will get Red Hen!”"},{say:"“Fox,” said Red Hen."},{say:"“Have you met Rex yet?"},{say:"Rex is our big dog.”"},{say:"Rex ran at Fox."},{say:"Fox hid in his den."},{say:"“I quit!” yaps Fox."}];
var PLAY_LABEL='\u25b6  Play all';

var CUR=-1, PLAYING=false, RATE=1, AUD=null, TIMER=null;
function row(i){return document.querySelector('.ln[data-i="'+i+'"]');}
function clearHi(){
  var n=document.querySelectorAll('.ln.on');
  for(var k=0;k<n.length;k++){n[k].classList.remove('on');}
}
function highlight(i){
  clearHi();
  var r=row(i);
  if(r){r.classList.add('on');r.scrollIntoView({block:'center',behavior:'smooth'});}
}
function halt(){
  if(AUD){AUD.pause();AUD=null;}
  if(TIMER){clearTimeout(TIMER);TIMER=null;}
  try{window.speechSynthesis.cancel();}catch(e){}
}
function stopAll(){
  PLAYING=false;halt();clearHi();CUR=-1;
  var b=document.getElementById('playall');
  b.textContent=PLAY_LABEL;b.classList.remove('on');
}
function say(i,done){
  halt();
  CUR=i;highlight(i);
  var r=row(i); if(r){r.classList.add('done');}
  if(AUDIO[i]){
    AUD=new Audio(AUDIO[i]);
    AUD.playbackRate=RATE;
    AUD.onended=function(){AUD=null;if(done){done();}};
    AUD.onerror=function(){AUD=null;if(done){done();}};
    AUD.play();
  }else{
    var u=new SpeechSynthesisUtterance(LINES[i].say);
    u.lang='en-US';u.rate=0.82*RATE;u.pitch=1;
    u.onend=function(){if(done){done();}};
    u.onerror=function(){if(done){done();}};
    window.speechSynthesis.speak(u);
  }
}
function step(i){
  if(!PLAYING||i>=LINES.length){stopAll();return;}
  say(i,function(){
    if(!PLAYING){return;}
    TIMER=setTimeout(function(){step(i+1);},520);
  });
}
function playAll(){
  var b=document.getElementById('playall');
  if(PLAYING){stopAll();return;}
  PLAYING=true;b.textContent='\u25a0  Stop';b.classList.add('on');
  step(CUR>=0&&CUR<LINES.length-1?CUR:0);
}
function tap(i){
  if(PLAYING){stopAll();}
  say(i,null);
}
function setRate(r,btn){
  RATE=r;
  var n=document.querySelectorAll('.speed button');
  for(var k=0;k<n.length;k++){n[k].classList.remove('on');}
  btn.classList.add('on');
  if(AUD){AUD.playbackRate=r;}
}
document.addEventListener('keydown',function(e){
  if(e.key===' '||e.key==='Escape'){
    if(PLAYING||AUD){e.preventDefault();stopAll();}
  }
});
</script>
